project:
  name: Local AI Assistant
  platform: windows
  architecture: local-first
  ui: tauri-react-typescript
  default_language: it
hardware_profile:
  cpu: AMD Ryzen 7 5700X
  ram_gib: 48
  gpu: NVIDIA RTX 2060
  vram_gib: 6
  default_model_class: 3b-4b-q4
  context_tokens: 8192
local_models:
  runtime: ollama
  endpoint: http://127.0.0.1:11434
  concurrent_gpu_models: 1
  unload_specialists_after_use: true
  guardrail_mode: keyword-gated-defense-in-depth
  roles:
    chat: qwen3:4b-instruct
    reasoning: qwen3:4b
    coding: qwen2.5-coder:3b
    vision: qwen2.5vl:3b
    embeddings: qwen3-embedding:0.6b
    guardrail: granite3-guardian:2b
security:
  default_mode: workspace-write
  approvals: on-request
  shell_freeform: forbidden
  network_default: disabled
  secrets_store: windows-credential-manager
  key_protection: windows-dpapi
  encryption: aes-256-gcm
  future_encryption_options: [xchacha20-poly1305]
  encryption_context: message-metadata-aad-v2
  password_kdf: argon2id
  trusted_boundary: rust-backend
  webview_sql: forbidden
  content_security_policy: strict-ipc-only
  webview_runtime_diagnostics: windows-controlled-not-zero-egress
  audit_integrity: sha256-chain-hmac
  capability_enforcement: backend-static-fail-closed
  ollama_boundary: rust-backend-loopback-only
  ollama_cloud_models: forbidden
  evolution_host_full_access: forbidden
  evolution_execution: disabled-until-strong-sandbox-verified
  evolution_promotion: manual-only
voice:
  mode: push-to-talk
  engine: whisper.cpp
  model: base-multilingual
  language: it
  preferred_device_label: OPPO Enco Buds2 Pro Hands-Free
  device_selection: explicit-with-label-fallback
  accepted_capture_rates_hz: [8000, 16000, 44100, 48000]
  transcription_rate_hz: 16000
  concurrent_transcriptions: 1
  max_recording_seconds: 30
  auto_submit: optional-confidence-gte-70
  auto_execute: false
  tts_engine: windows-sapi-it-it
  tts_interruptible: true
capabilities:
  phase_1: [chat-shell, policy-engine, audit-preview, resource-profile]
  phase_2: [ollama, sqlite-history, model-manager]
  phase_3: [push-to-talk, whisper, windows-sapi-tts]
  phase_4: [safe-pc-tools, writable-roots, rollback]
  phase_5: [document-library, incremental-rag, citations]
  phase_6: [isolated-browser, web-research, manual-takeover]
  phase_7: [api-connectors, oauth, openapi, webhooks]
  phase_8: [sandbox-evolution, plugin-manifests, vm-tests]
  phase_9: [defensive-security, defender, patch-report]
implemented_pc_tools: [system-metrics-readonly, process-list-limited, open-app-allowlist-confirmed, terminate-pid-protected-confirmed, lock-workstation-confirmed]
personalization:
  encrypted_profile: true
  explicit_feedback: true
  local_model_context_only: true
  preferences_are_authorization: false
evolution_lab:
  current_mode: pipeline-connected-fail-closed
  strong_sandbox_detected: false
  generated_code_execution: disabled-pending-reboot-and-runtime-verification
  encrypted_report_history: authenticated-and-bounded
  runtime_detection: operational-probe-with-timeout
non_goals: [minecraft, offensive-security, credential-extraction, autonomous-privilege-escalation]
